# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sgrh_public?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=3030

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Authentication (override these values through environment variables in production)
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.email=${ADMIN_EMAIL:admin@sgrh.gov.mg}

# Double authentification par e-mail
app.auth.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
app.auth.otp.from=${MAIL_FROM:no-reply@sgrh.gov.mg}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# Démonstration locale uniquement : stocke les nouveaux mots de passe en clair.
# Utiliser PASSWORD_STORAGE=bcrypt dans tout environnement réel.
app.security.password-storage=${PASSWORD_STORAGE:plaintext}
